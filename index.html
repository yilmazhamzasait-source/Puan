<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SEANS — Puan Defteri</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');

  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0a0a0a; color: #f5f5f5; font-family: 'Inter', system-ui, sans-serif; }
  a, button, input { font-family: inherit; }

  .wrap { max-width: 900px; margin: 0 auto; padding: 40px 24px; }
  .wrap-narrow { max-width: 640px; margin: 0 auto; padding: 32px 24px; }

  .title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
  .title { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; font-size: 40px; color: #fbbf24; margin: 0; }
  .subtitle { color: #737373; font-size: 14px; margin: 0 0 32px 34px; }
  .empty-msg { color: #525252; font-size: 14px; margin: 0 0 32px; }
  .empty-msg span { color: #fbbf24; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 900px) { .grid { grid-template-columns: repeat(4, 1fr); } }

  .poster { position: relative; aspect-ratio: 2 / 3; border-radius: 8px; overflow: hidden; border: 1px solid #262626;
    cursor: pointer; text-align: left; display: block; width: 100%; padding: 0; }
  .poster:hover { border-color: rgba(251,191,36,0.6); }
  .poster-label { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; }
  .poster-name { font-family: 'Bebas Neue', sans-serif; font-size: 24px; line-height: 1.15; letter-spacing: 0.02em; word-break: break-word; }
  .poster-sub { color: #a3a3a3; font-size: 12px; margin-top: 4px; }
  .poster-scores { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
  .poster-scores .score-pair { color: #d4d4d4; }
  .poster-scores .score-my { color: #34d399; }
  .poster-scores .score-imdb { color: #fbbf24; }
  .poster-scores .score-sep { color: #525252; }
  .poster-diff-dot { width: 7px; height: 7px; border-radius: 999px; flex-shrink: 0; }
  .dot-green { background: #34d399; }
  .dot-red { background: #f87171; }
  .dot-gray { background: #737373; }

  .overall-avg { display: inline-flex; align-items: center; gap: 14px; background: #171717; border: 1px solid #262626;
    border-radius: 8px; padding: 10px 16px; margin-bottom: 24px; }
  .overall-avg-item { display: flex; flex-direction: column; align-items: flex-start; }
  .overall-avg-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: #737373; margin-bottom: 2px; }
  .overall-avg-val { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 500; }
  .overall-avg-val.my { color: #34d399; }
  .overall-avg-val.imdb { color: #fbbf24; }
  .overall-avg-divider { width: 1px; align-self: stretch; background: #262626; }
  .overall-avg-note { color: #525252; font-size: 12px; margin-bottom: 24px; }
  .poster-del { position: absolute; top: 8px; right: 8px; z-index: 5; width: 24px; height: 24px; border-radius: 999px;
    background: rgba(0,0,0,0.4); color: #e5e5e5; border: none; cursor: pointer; font-size: 13px; line-height: 1; }
  .poster-del:hover { background: rgba(0,0,0,0.7); }
  .sprockets { position: absolute; top: 8px; left: 8px; display: flex; gap: 6px; opacity: 0.4; }
  .sprocket-dot { width: 5px; height: 5px; border-radius: 1px; background: #404040; }

  .add-tile { aspect-ratio: 2 / 3; border-radius: 8px; border: 1px dashed #404040; background: transparent;
    color: #525252; font-size: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .add-tile:hover { border-color: rgba(251,191,36,0.6); color: #fbbf24; background: #171717; }
  .add-tile-input-wrap { aspect-ratio: 2 / 3; border-radius: 8px; border: 1px dashed rgba(251,191,36,0.6); background: #171717;
    display: flex; align-items: center; justify-content: center; padding: 12px; }
  .add-tile-input-wrap input { width: 100%; background: transparent; border: none; border-bottom: 1px solid #404040;
    color: #f5f5f5; text-align: center; outline: none; font-size: 14px; padding-bottom: 4px; }

  .confirm-overlay { position: absolute; inset: 0; z-index: 20; background: rgba(0,0,0,0.85); display: flex;
    flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; text-align: center; }
  .confirm-overlay span { color: #e5e5e5; font-size: 14px; }
  .confirm-btns { display: flex; gap: 8px; }
  .btn-danger { padding: 6px 12px; border-radius: 6px; background: #991b1b; color: #f5f5f5; border: none; font-size: 12px; font-weight: 500; cursor: pointer; }
  .btn-danger:hover { background: #b91c1c; }
  .btn-muted { padding: 6px 12px; border-radius: 6px; background: #404040; color: #f5f5f5; border: none; font-size: 12px; font-weight: 500; cursor: pointer; }
  .btn-muted:hover { background: #525252; }

  .back-link { display: inline-flex; align-items: center; gap: 6px; color: #737373; text-decoration: none; font-size: 14px;
    background: none; border: none; cursor: pointer; padding: 0; margin-bottom: 24px; }
  .back-link:hover { color: #fbbf24; }
  .crumbs { display: flex; align-items: center; gap: 12px; font-size: 14px; margin-bottom: 24px; }
  .crumbs button { background: none; border: none; color: #737373; cursor: pointer; font-size: 14px; padding: 0; }
  .crumbs button:hover { color: #fbbf24; }
  .crumbs .sep { color: #404040; }

  .season-title-input { width: 100%; background: transparent; border: none; border-bottom: 1px solid transparent;
    font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 0.03em; color: #fbbf24; outline: none; padding-bottom: 8px; margin-bottom: 4px; }
  .season-title-input:focus { border-bottom-color: rgba(251,191,36,0.4); }
  .season-sub { color: #737373; font-size: 14px; margin-bottom: 4px; }

  table.ep-table { width: 100%; border-collapse: collapse; border: 1px solid #262626; border-radius: 8px; overflow: hidden; }
  .table-wrap { border: 1px solid #262626; border-radius: 8px; overflow: hidden; }
  .ep-row { display: grid; grid-template-columns: 2.5rem 1fr 1fr 1fr 2rem; align-items: center; padding: 8px 12px;
    border-top: 1px solid #262626; position: relative; }
  .ep-row.odd { background: rgba(38,38,38,0.4); }
  .ep-head { display: grid; grid-template-columns: 2.5rem 1fr 1fr 1fr 2rem; background: #171717; color: #737373;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 12px; }
  .ep-num { font-family: 'JetBrains Mono', monospace; color: #737373; font-size: 14px; }
  .ep-input { width: 100%; background: #171717; border: 1px solid #262626; border-radius: 6px; padding: 4px 8px;
    color: #f5f5f5; font-family: 'JetBrains Mono', monospace; font-size: 14px; outline: none; margin-right: 8px; box-sizing: border-box; }
  .ep-input:focus { border-color: #059669; }
  .ep-input.imdb:focus { border-color: #d97706; }
  .ep-cell-pad { padding-right: 8px; }
  .diff-box { text-align: center; border-radius: 6px; padding: 4px 8px; font-size: 14px; font-weight: 500; border: 1px solid;
    font-family: 'JetBrains Mono', monospace; }
  .diff-gray { color: #d4d4d4; background: rgba(64,64,64,0.4); border-color: #525252; }
  .diff-red { color: #f87171; background: rgba(69,10,10,0.5); border-color: #7f1d1d; }
  .diff-green { color: #34d399; background: rgba(2,44,34,0.5); border-color: #065f46; }
  .diff-empty { color: #525252; background: #171717; border-color: #262626; }
  .ep-del { background: none; border: none; color: #525252; cursor: pointer; display: flex; justify-content: center; font-size: 13px; }
  .ep-del:hover { color: #f87171; }
  .ep-empty { padding: 24px 12px; text-align: center; color: #525252; font-size: 14px; }
  .avg-row { display: grid; grid-template-columns: 2.5rem 1fr 1fr 1fr 2rem; align-items: center; padding: 10px 12px;
    border-top: 1px solid #404040; background: rgba(23,23,23,0.7); }
  .avg-label { color: #fbbf24; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .avg-val { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #e5e5e5; padding-right: 8px; }
  .add-ep-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px;
    background: none; border: none; border-top: 1px solid #262626; color: #737373; cursor: pointer; font-size: 14px; }
  .add-ep-btn:hover { color: #fbbf24; background: rgba(23,23,23,0.6); }

  .legend { display: flex; gap: 16px; margin: 16px 0 0 4px; font-size: 12px; color: #525252; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; border: 1px solid; }
</style>
</head>
<body>
<div id="root"></div>

<script>
"use strict";

var STORAGE_KEY = "seans:productions";

var POSTER_THEMES = [
  { from: "#3a0d12", to: "#7a1f2b", ring: "#c94a5a" },
  { from: "#0d2b2b", to: "#155e5e", ring: "#3fb8b8" },
  { from: "#1a1440", to: "#3d2f8f", ring: "#8b7cf0" },
  { from: "#2b230a", to: "#6b5416", ring: "#e0b23f" },
  { from: "#0f2a12", to: "#215c27", ring: "#4fbf5c" },
  { from: "#331018", to: "#6e1f33", ring: "#d84a76" },
];

function themeFor(name) {
  var h = 0;
  for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % POSTER_THEMES.length;
  return POSTER_THEMES[Math.abs(h)];
}

function uid() {
  return Math.random().toString(36).slice(2, 10);
}

function normalizeProduction(p) {
  if (Array.isArray(p.seasons)) return p;
  return {
    id: p.id,
    name: p.name,
    seasons: [{ id: uid(), title: p.seasonTitle || "1. Sezon", episodes: p.episodes || [] }],
  };
}

function diffInfo(my, imdb) {
  if (my === "" || imdb === "" || my === undefined || imdb === undefined) return { label: "—", cls: "diff-empty" };
  var m = parseFloat(my), i = parseFloat(imdb);
  if (isNaN(m) || isNaN(i)) return { label: "—", cls: "diff-empty" };
  var d = m - i;
  var label = (d > 0 ? "+" : "") + d.toFixed(1);
  if (Math.abs(d) < 0.001) return { label: "0.0", cls: "diff-gray" };
  if (d < 0) return { label: label, cls: "diff-red" };
  return { label: label, cls: "diff-green" };
}

function computeAverages(episodes) {
  var validMy = episodes.map(function (e) { return parseFloat(e.myScore); }).filter(function (v) { return !isNaN(v); });
  var validImdb = episodes.map(function (e) { return parseFloat(e.imdbScore); }).filter(function (v) { return !isNaN(v); });
  var avgMy = validMy.length ? validMy.reduce(function (a, b) { return a + b; }, 0) / validMy.length : null;
  var avgImdb = validImdb.length ? validImdb.reduce(function (a, b) { return a + b; }, 0) / validImdb.length : null;
  return { avgMy: avgMy, avgImdb: avgImdb };
}

function loadProductions() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    return JSON.parse(raw).map(normalizeProduction);
  } catch (e) { return []; }
}
function saveProductions() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.productions)); } catch (e) {}
}

var state = {
  productions: loadProductions(),
  view: { type: "home" },
  pendingDelete: null,
};

function findProduction(id) { return state.productions.find(function (p) { return p.id === id; }); }
function findSeason(prod, id) { return prod.seasons.find(function (s) { return s.id === id; }); }

// ---------- tiny DOM helper ----------
function el(tag, attrs, children) {
  attrs = attrs || {};
  var e = document.createElement(tag);
  Object.keys(attrs).forEach(function (k) {
    var v = attrs[k];
    if (v === undefined || v === null) return;
    if (k === "class") e.className = v;
    else if (k === "style") Object.assign(e.style, v);
    else if (k.indexOf("on") === 0 && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  });
  (children || []).forEach(function (c) {
    if (c === null || c === undefined) return;
    e.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(c) : c);
  });
  return e;
}

function sprockets() {
  var wrap = el("div", { class: "sprockets" }, []);
  for (var i = 0; i < 20; i++) wrap.appendChild(el("div", { class: "sprocket-dot" }, []));
  return wrap;
}

function render() {
  var root = document.getElementById("root");
  root.innerHTML = "";
  if (state.view.type === "home") root.appendChild(renderHome());
  else if (state.view.type === "production") root.appendChild(renderProduction());
  else if (state.view.type === "season") root.appendChild(renderSeason());
}

// ---------- add-tile (used on home + production views) ----------
function addTile(placeholder, onAdd) {
  var container = el("div", {}, []);
  var showInput = false;

  function draw() {
    container.innerHTML = "";
    if (!showInput) {
      container.appendChild(el("button", { class: "add-tile", onclick: function () { showInput = true; draw(); } }, ["+"]));
      return;
    }
    var input = el("input", { placeholder: placeholder });
    var committed = false;
    function commit() {
      if (committed) return;
      committed = true;
      var val = input.value.trim();
      showInput = false;
      if (val) onAdd(val);
      else draw();
    }
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") commit();
      if (e.key === "Escape") { committed = true; showInput = false; draw(); }
    });
    input.addEventListener("blur", commit);
    var wrap = el("div", { class: "add-tile-input-wrap" }, [input]);
    container.appendChild(wrap);
    setTimeout(function () { input.focus(); }, 0);
  }
  draw();
  return container;
}

// ---------- HOME ----------
function renderHome() {
  var wrap = el("div", { class: "wrap" }, []);
  wrap.appendChild(el("div", { class: "title-row" }, [
    el("span", { style: { fontSize: "22px" } }, ["🎬"]),
    el("h1", { class: "title" }, ["SEANS"]),
  ]));
  wrap.appendChild(el("p", { class: "subtitle" }, ["puan defteri"]));

  if (state.productions.length === 0) {
    var msg = el("div", { class: "empty-msg" }, []);
    msg.appendChild(document.createTextNode("Henüz bir yapım eklemedin. Başlamak için aşağıdaki "));
    msg.appendChild(el("span", {}, ["+"]));
    msg.appendChild(document.createTextNode(" kutusuna dokun."));
    wrap.appendChild(msg);
  }

  var grid = el("div", { class: "grid" }, []);

  state.productions.forEach(function (p) {
    var theme = themeFor(p.name);
    var card = el("div", {
      class: "poster",
      tabindex: "0",
      style: { background: "linear-gradient(160deg," + theme.from + "," + theme.to + ")" },
      onclick: function () { state.view = { type: "production", productionId: p.id }; render(); },
    }, []);

    var delBtn = el("button", {
      class: "poster-del",
      title: "Yapımı sil",
      onclick: function (e) { e.stopPropagation(); state.pendingDelete = { type: "production", id: p.id }; render(); },
    }, ["✕"]);
    card.appendChild(delBtn);

    if (state.pendingDelete && state.pendingDelete.type === "production" && state.pendingDelete.id === p.id) {
      card.appendChild(confirmOverlay('"' + p.name + '" silinsin mi?', function () {
        state.productions = state.productions.filter(function (x) { return x.id !== p.id; });
        state.pendingDelete = null;
        saveProductions();
        render();
      }));
    }

    card.appendChild(sprockets());
    card.appendChild(el("div", { class: "poster-label" }, [
      el("div", { class: "poster-name", style: { color: theme.ring } }, [p.name]),
      el("div", { class: "poster-sub" }, [p.seasons.length + " sezon"]),
    ]));

    grid.appendChild(card);
  });

  grid.appendChild(addTile("Yapım adı", function (name) {
    state.productions.push({ id: uid(), name: name, seasons: [] });
    saveProductions();
    render();
  }));

  wrap.appendChild(grid);
  return wrap;
}

function confirmOverlay(message, onConfirm) {
  var overlay = el("div", { class: "confirm-overlay", onclick: function (e) { e.stopPropagation(); } }, [
    el("span", {}, [message]),
    el("div", { class: "confirm-btns" }, [
      el("button", { class: "btn-danger", onclick: onConfirm }, ["Sil"]),
      el("button", { class: "btn-muted", onclick: function () { state.pendingDelete = null; render(); } }, ["Vazgeç"]),
    ]),
  ]);
  return overlay;
}

// ---------- PRODUCTION (season list) ----------
function renderProduction() {
  var prod = findProduction(state.view.productionId);
  if (!prod) { state.view = { type: "home" }; return renderHome(); }

  var wrap = el("div", { class: "wrap" }, []);
  wrap.appendChild(el("button", {
    class: "back-link",
    onclick: function () { state.view = { type: "home" }; render(); },
  }, ["← Anasayfa"]));

  wrap.appendChild(sprockets());
  wrap.appendChild(el("h2", { class: "title", style: { fontSize: "36px" } }, [prod.name]));
  wrap.appendChild(el("div", { class: "season-sub" }, ["sezonlar"]));
  wrap.appendChild(el("div", { style: { marginBottom: "24px" } }, [sprockets()]));

  var allEpisodes = [];
  prod.seasons.forEach(function (s) { allEpisodes = allEpisodes.concat(s.episodes); });
  var overall = computeAverages(allEpisodes);
  if (overall.avgMy !== null || overall.avgImdb !== null) {
    var overallDiff = (overall.avgMy !== null && overall.avgImdb !== null) ? diffInfo(overall.avgMy, overall.avgImdb) : null;
    var box = el("div", { class: "overall-avg" }, [
      el("div", { class: "overall-avg-item" }, [
        el("div", { class: "overall-avg-label" }, ["Benim Puanım"]),
        el("div", { class: "overall-avg-val my" }, [overall.avgMy !== null ? overall.avgMy.toFixed(1) : "—"]),
      ]),
      el("div", { class: "overall-avg-divider" }, []),
      el("div", { class: "overall-avg-item" }, [
        el("div", { class: "overall-avg-label" }, ["IMDb Puanı"]),
        el("div", { class: "overall-avg-val imdb" }, [overall.avgImdb !== null ? overall.avgImdb.toFixed(1) : "—"]),
      ]),
      el("div", { class: "overall-avg-divider" }, []),
      el("div", { class: "overall-avg-item" }, [
        el("div", { class: "overall-avg-label" }, ["Fark"]),
        el("div", { class: "diff-box " + (overallDiff ? overallDiff.cls : "diff-empty"), style: { fontSize: "16px" } }, [overallDiff ? overallDiff.label : "—"]),
      ]),
    ]);
    wrap.appendChild(box);
    wrap.appendChild(el("div", { class: "overall-avg-note" }, ["tüm sezonların ortalaması, " + allEpisodes.length + " bölüm"]));
  }

  if (prod.seasons.length === 0) {
    var msg = el("div", { class: "empty-msg" }, []);
    msg.appendChild(document.createTextNode("Henüz sezon eklenmedi. Başlamak için aşağıdaki "));
    msg.appendChild(el("span", {}, ["+"]));
    msg.appendChild(document.createTextNode(" kutusuna dokun."));
    wrap.appendChild(msg);
  }

  var grid = el("div", { class: "grid" }, []);

  prod.seasons.forEach(function (s) {
    var theme = themeFor(prod.name + s.title);
    var card = el("div", {
      class: "poster",
      tabindex: "0",
      style: { background: "linear-gradient(160deg," + theme.from + "," + theme.to + ")" },
      onclick: function () { state.view = { type: "season", productionId: prod.id, seasonId: s.id }; render(); },
    }, []);

    card.appendChild(el("button", {
      class: "poster-del", title: "Sezonu sil",
      onclick: function (e) { e.stopPropagation(); state.pendingDelete = { type: "season", id: s.id }; render(); },
    }, ["✕"]));

    if (state.pendingDelete && state.pendingDelete.type === "season" && state.pendingDelete.id === s.id) {
      card.appendChild(confirmOverlay('"' + s.title + '" silinsin mi?', function () {
        prod.seasons = prod.seasons.filter(function (x) { return x.id !== s.id; });
        state.pendingDelete = null;
        saveProductions();
        render();
      }));
    }

    card.appendChild(sprockets());
    var labelChildren = [
      el("div", { class: "poster-name", style: { color: theme.ring } }, [s.title]),
      el("div", { class: "poster-sub", style: { fontFamily: "'JetBrains Mono', monospace" } }, [s.episodes.length + " bölüm"]),
    ];
    var avgs = computeAverages(s.episodes);
    if (avgs.avgMy !== null || avgs.avgImdb !== null) {
      var d = (avgs.avgMy !== null && avgs.avgImdb !== null) ? diffInfo(avgs.avgMy, avgs.avgImdb) : null;
      var dotCls = "dot-gray";
      if (d) { if (d.cls === "diff-green") dotCls = "dot-green"; else if (d.cls === "diff-red") dotCls = "dot-red"; }
      var scoreRow = el("div", { class: "poster-scores" }, [
        el("span", { class: "score-my" }, [avgs.avgMy !== null ? avgs.avgMy.toFixed(1) : "—"]),
        el("span", { class: "score-sep" }, ["·"]),
        el("span", { class: "score-imdb" }, [avgs.avgImdb !== null ? avgs.avgImdb.toFixed(1) : "—"]),
      ]);
      if (d) scoreRow.insertBefore(el("div", { class: "poster-diff-dot " + dotCls }, []), scoreRow.firstChild);
      labelChildren.push(scoreRow);
    }
    card.appendChild(el("div", { class: "poster-label" }, labelChildren));

    grid.appendChild(card);
  });

  grid.appendChild(addTile("Sezon adı", function (title) {
    prod.seasons.push({ id: uid(), title: title, episodes: [] });
    saveProductions();
    render();
  }));

  wrap.appendChild(grid);
  return wrap;
}

// ---------- SEASON (episode table) ----------
function renderSeason() {
  var prod = findProduction(state.view.productionId);
  if (!prod) { state.view = { type: "home" }; return renderHome(); }
  var season = findSeason(prod, state.view.seasonId);
  if (!season) { state.view = { type: "production", productionId: prod.id }; return renderProduction(); }

  var wrap = el("div", { class: "wrap-narrow" }, []);

  var crumbs = el("div", { class: "crumbs" }, [
    el("button", { onclick: function () { state.view = { type: "home" }; render(); } }, ["← Anasayfa"]),
    el("span", { class: "sep" }, ["/"]),
    el("button", { onclick: function () { state.view = { type: "production", productionId: prod.id }; render(); } }, [prod.name]),
  ]);
  wrap.appendChild(crumbs);

  wrap.appendChild(sprockets());

  var titleInput = el("input", { class: "season-title-input", value: season.title });
  titleInput.addEventListener("input", function () {
    season.title = titleInput.value;
    saveProductions();
  });
  wrap.appendChild(titleInput);
  wrap.appendChild(el("div", { class: "season-sub" }, [prod.name]));
  wrap.appendChild(el("div", { style: { marginTop: "8px", marginBottom: "24px" } }, [sprockets()]));

  var tableWrap = el("div", { class: "table-wrap" }, []);
  tableWrap.appendChild(el("div", { class: "ep-head" }, [
    el("div", {}, ["#"]), el("div", {}, ["Benim Puanım"]), el("div", {}, ["IMDb Puanı"]), el("div", {}, ["Fark"]), el("div", {}, []),
  ]));

  if (season.episodes.length === 0) {
    tableWrap.appendChild(el("div", { class: "ep-empty" }, ["Henüz bölüm eklenmedi."]));
  }

  var avgRowRef = { el: null };

  function updateAverages() {
    if (!avgRowRef.el) return;
    var avgs = computeAverages(season.episodes);
    var avgMy = avgs.avgMy, avgImdb = avgs.avgImdb;
    var d = (avgMy !== null && avgImdb !== null) ? diffInfo(avgMy, avgImdb) : { label: "—", cls: "diff-empty" };
    avgRowRef.el.querySelector(".avg-my").textContent = avgMy !== null ? avgMy.toFixed(1) : "—";
    avgRowRef.el.querySelector(".avg-imdb").textContent = avgImdb !== null ? avgImdb.toFixed(1) : "—";
    var diffBox = avgRowRef.el.querySelector(".avg-diff");
    diffBox.textContent = d.label;
    diffBox.className = "diff-box " + d.cls;
  }

  season.episodes.forEach(function (ep, idx) {
    var row = el("div", { class: "ep-row" + (idx % 2 === 1 ? " odd" : ""), style: { position: "relative" } }, []);
    row.appendChild(el("div", { class: "ep-num" }, [String(idx + 1)]));

    var myInput = el("input", { class: "ep-input", type: "number", step: "0.1", value: ep.myScore, placeholder: "—" });
    var imdbInput = el("input", { class: "ep-input imdb", type: "number", step: "0.1", value: ep.imdbScore, placeholder: "—" });
    var diffBox = el("div", { class: "diff-box" }, []);

    function refreshDiff() {
      var d = diffInfo(ep.myScore, ep.imdbScore);
      diffBox.textContent = d.label;
      diffBox.className = "diff-box " + d.cls;
      updateAverages();
    }

    myInput.addEventListener("input", function () { ep.myScore = myInput.value; saveProductions(); refreshDiff(); });
    imdbInput.addEventListener("input", function () { ep.imdbScore = imdbInput.value; saveProductions(); refreshDiff(); });

    row.appendChild(el("div", { class: "ep-cell-pad" }, [myInput]));
    row.appendChild(el("div", { class: "ep-cell-pad" }, [imdbInput]));
    row.appendChild(el("div", { class: "ep-cell-pad" }, [diffBox]));
    row.appendChild(el("button", {
      class: "ep-del", title: "Bölümü sil",
      onclick: function () { state.pendingDelete = { type: "episode", id: ep.id }; render(); },
    }, ["🗑"]));

    if (state.pendingDelete && state.pendingDelete.type === "episode" && state.pendingDelete.id === ep.id) {
      var ov = el("div", { class: "confirm-overlay", style: { background: "rgba(10,10,10,0.95)" } }, [
        el("span", { style: { fontSize: "12px" } }, [(idx + 1) + ". bölüm silinsin mi?"]),
        el("div", { class: "confirm-btns" }, [
          el("button", {
            class: "btn-danger",
            onclick: function () {
              season.episodes = season.episodes.filter(function (x) { return x.id !== ep.id; });
              state.pendingDelete = null;
              saveProductions();
              render();
            },
          }, ["Sil"]),
          el("button", { class: "btn-muted", onclick: function () { state.pendingDelete = null; render(); } }, ["Vazgeç"]),
        ]),
      ]);
      row.appendChild(ov);
    }

    refreshDiff();
    tableWrap.appendChild(row);
  });

  if (season.episodes.length > 0) {
    var avgRow = el("div", { class: "avg-row" }, [
      el("div", { class: "avg-label" }, ["Ort."]),
      el("div", { class: "avg-val avg-my" }, ["—"]),
      el("div", { class: "avg-val avg-imdb" }, ["—"]),
      el("div", { class: "ep-cell-pad" }, [el("div", { class: "diff-box avg-diff" }, ["—"])]),
      el("div", {}, []),
    ]);
    avgRowRef.el = avgRow;
    tableWrap.appendChild(avgRow);
    updateAverages();
  }

  tableWrap.appendChild(el("button", {
    class: "add-ep-btn",
    onclick: function () {
      season.episodes.push({ id: uid(), myScore: "", imdbScore: "" });
      saveProductions();
      render();
    },
  }, ["+ Bölüm Ekle"]));

  wrap.appendChild(tableWrap);

  var legend = el("div", { class: "legend" }, [
    el("div", { class: "legend-item" }, [el("div", { class: "legend-swatch", style: { background: "#065f46", borderColor: "#059669" } }, []), "Benim puanım yüksek"]),
    el("div", { class: "legend-item" }, [el("div", { class: "legend-swatch", style: { background: "#7f1d1d", borderColor: "#991b1b" } }, []), "IMDb yüksek"]),
    el("div", { class: "legend-item" }, [el("div", { class: "legend-swatch", style: { background: "#404040", borderColor: "#525252" } }, []), "Eşit"]),
  ]);
  wrap.appendChild(legend);

  return wrap;
}

render();
</script>
</body>
</html>
